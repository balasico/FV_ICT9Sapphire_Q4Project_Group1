  <div class="container">
        <h1 class="" id="head1"></h1>
        <h1 class="text-center">Student Profile</h1>
        
<br>

    <details class="ontoggle text-center">
        <summary>Instructions:</summary>
        <p id="instruct" class="text-center"></p>
</details>

<br><br>

	<form action="#">
        <div class="row mb-3">
    <div class="col-md-6">
        <label for="name1" class="form-label">First Name:</label>
        <input type="text" id="name1" name="name1" class="form-control" placeholder="Juan">
    </div>

    <div class="col-md-6">
        <label for="name2" class="form-label">Last Name:</label>
        <input type="text" id="name2" name="name2" class="form-control" placeholder="Dela Cruz">
    </div>
</div>

<br>

<b><p>Profile Picture</p></b>
    <img src="https://img.freepik.com/premium-vector/profile-picture-placeholder-avatar-silhouette-gray-tones-icon-colored-shapes-gradient_1076610-40164.jpg"
    alt="Description" width="100" height="100">
    <input type="file">
    <button type="submit" id="" name="">Upload Photo</button>

<br>  

<div class="row mb-3">
    <div class="col-md-6">
        <label for="name1" class="form-label">Username:</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="xXSapphireGoatXx">
    </div>

    <div class="col-md-6">
        <label for="name2" class="form-label">Age:</label>
        <input type="number" id="age" name="age" class="form-control" placeholder="X">
    </div>
</div>

<br>

    <div class="col-md-6">
        <label for="name2" class="form-label">Address:</label>
        <input type="text" id="address" name="address" class="form-control" placeholder="Blk x Lot x Sapphire Street">
    </div>

<br>

    <div class="col-md-6">
        <label for="name2" class="form-label">Password:</label>
        <input type="password" id="pw" name="pw" class="form-control" placeholder="....">
    </div>

        <input type="checkbox" id= "me" name="me">
        <label for="rem" id="rem">
        Remember me</label>
<br><br>

    <div class="col-md-6">
        <label for="name2" class="form-label">Email:</label>
        <input type="text" id="email" name="email" class="form-control" placeholder="juandelacruz@gmail.com">
    </div>

<br>

		<label for="Gender">Gender:</label>

		<br>
		<input type="radio" id= "male" name="gender">
		<label for= "Gender">Male</label>
		<br>
		<input type="radio" id= "female" name="gender">
		<label for= "Gender">Female</label>

		<br><br>

   <div class="col-md-6">
        <label for="name2" class="form-label">Contact Number:</label>
        <input type="number" id="Connumber" name="Connumber" class="form-control" placeholder="xxx-xxx-xxx-xx">
    </div>

		<br><br>

		<input type="submit" id="submit" name="submit" value="Submit Form">
		<input type="submit" id="reset" name="reset" value="Clear All">

	</form>
</div>

<script>
    document.getElementById('instruct').innerHTML = "Please fill in the necessary information in the registration form to sign in and catch a ride in Sakay na!";
